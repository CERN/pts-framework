name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build the disposable CI image
        run: >-
          docker build
          --build-arg SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PTS_FRAMEWORK=0+g${GITHUB_SHA::7}
          --tag pts-framework-ci:${GITHUB_SHA}
          .

      - name: Run tests in the CI image
        run: docker run --rm pts-framework-ci:${GITHUB_SHA}
