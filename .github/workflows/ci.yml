name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  publish-image:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/_publish-image.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
