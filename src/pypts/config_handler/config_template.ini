# pypts configuration.
#
# This file was created from the template shipped with pypts. It is yours to
# edit, and keeping it correct is yours too: pypts reads it on every start but
# never repairs or migrates it. A file that does not validate, or whose
# structure version does not match, is ignored for that run: pypts tells you
# so at startup and runs on its built-in defaults instead, without touching
# this file. Correct it, or delete it and it will be recreated from the
# template with default values.
#
# Every comment below comes from the template and is restored whenever the file
# is rewritten.

[meta]
# Structure version of this file. Written when the file is created - do not
# edit. A version that does not match the running pypts means the whole file
# is ignored for the run (see the note at the top); the file itself is never
# changed by pypts.
config_version = 1

[operating_system]
# Detected once, when this file was created, and never touched again.
# It records the machine the configuration was set up on; it is not a setting,
# and changing it changes nothing.
name =
version =
architecture =
kernel =

[paths]
# Everything pypts writes lives under base_dir. It is filled in on first
# creation with the standard per-user data directory for this platform
# (%LOCALAPPDATA%\pypts on Windows, ~/.local/share/pypts on Linux).
#
# Point these somewhere else to move pypts' output - a network share, a bench
# drive, a scratch disk. Absolute paths only. Directories are created if they
# do not exist.
base_dir =

# Where the run log is written. One timestamped file per run.
logs_dir =

# Where reports are written after an execution.
reports_dir =

[logging]
# Minimum level written to the run log:
# DEBUG, INFO, WARNING, ERROR or CRITICAL.
#
# DEBUG additionally turns on the message trace - every message on every link,
# logged twice, once by the sender and once by the receiver. Useful when the
# question is "who sent what to whom"; very noisy otherwise.
#
# It ships as DEBUG while the framework is being refactored, so that every run
# can be read afterwards and so the Debug Monitor
# (python -m pypts.helper_applications.debug_monitor) always has a trace to
# show. Expect roughly six heartbeat lines a second on an idle run. This goes
# back to INFO before v1.0.
#
# The --log-level command line option overrides this for a single run, so
# --log-level INFO is how to quieten one run without editing this file.
level = DEBUG

[report]
# Output format of the generated report: html or csv.
type = html

# Visual style of the generated report.
theme = default

[gui]
# Appearance of the graphical frontend: default, light or dark.
theme = default

# Size of the main window, in pixels, when it opens.
window_width = 1280
window_height = 720
