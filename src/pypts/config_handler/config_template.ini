# pypts configuration. Yours to edit; pypts never modifies this file.
# A file that is broken or version-mismatched is ignored for the run (the
# defaults are used instead) - correct it, or delete it to have it recreated.

[meta]
# Managed by pypts - do not edit. A mismatch means the file is ignored for the run.
config_version = 1

[operating_system]
# Detected once, when this file was created. Informational only.
name =
version =
architecture =
kernel =

[paths]
# Where pypts writes its output. Filled in at creation; absolute paths only.
base_dir =
logs_dir =
reports_dir =

[logging]
# DEBUG, INFO, WARNING, ERROR or CRITICAL. DEBUG adds the full message trace.
# Ships as DEBUG during the refactor; back to INFO before v1.0.
level = DEBUG

[report]
# type: html or csv.
type = html
theme = default

[gui]
# theme: default, light or dark. Window size in pixels.
theme = default
window_width = 1280
window_height = 720
