# pypts configuration. Yours to edit; pypts never modifies this file.
# A file that is broken or version-mismatched is ignored for the run (the
# defaults are used instead) - correct it, or delete it to have it recreated.

[meta]
# Managed by pypts - do not edit. A different major number means the file is
# ignored for the run.
config_version = 4.0.0

[operating_system]
# Detected once, when this file was created. Informational only.
name =
version =
architecture =
kernel =

[paths]
# Where pypts writes its output. Filled in at creation; absolute paths only.
# reports_dir holds the session log and one folder per run: the run's report
# and the log of that run.
base_dir =
reports_dir =

[logging]
# TRACE, DEBUG, INFO, WARNING, ERROR or CRITICAL. TRACE adds the full message
# trace; DEBUG is the developer detail without it.
# Ships as TRACE during the refactor; back to INFO before v1.0.
level = TRACE

[report]
# type: html or csv.
type = html
theme = default

[gui]
# theme: light, dark or system (follows the operating system). Also used by the
# Recipe Creator. window_mode: windowed or fullscreen. Window size in
# pixels - the windowed size, also used when leaving full screen.
# log_show_debug / log_show_info / log_show_warning / log_show_error: which
# levels the LOG OUTPUT panel shows (its buttons save them; the run log keeps
# everything). ERROR covers CRITICAL too. DEBUG lines exist only when [logging]
# level is DEBUG or TRACE.
theme = light
window_mode = windowed
window_width = 1280
window_height = 720
log_show_debug = false
log_show_info = true
log_show_warning = true
log_show_error = true

[recipe_editor]
# The Recipe Editor v2's window, set in its own Edit > Settings: theme (light,
# dark or system), window_mode (windowed or fullscreen), window size in pixels.
theme = light
window_mode = windowed
window_width = 1600
window_height = 1000

# Devices on the bench are declared in bench.ini, beside this file.
