# pypts configuration.
#
# This file was created from the template shipped with pypts. It is yours to
# edit: pypts reads it on every start and writes to it only when it has to add
# keys introduced by a newer version, in which case your values are kept and the
# previous file is saved next to this one as config.ini.v<n>.bak.
#
# Every comment below comes from the template and is restored whenever the file
# is rewritten.

[meta]
# Structure version of this file. Managed by pypts - do not edit.
# A file older than the running pypts is migrated automatically.
config_version = 1

[operating_system]
# Detected once, when this file was created, and never touched again.
# It records the machine the configuration was set up on; it is not a setting,
# and changing it changes nothing.
name =
version =
architecture =
kernel =

[paths]
# Everything pypts writes lives under base_dir. It is filled in on first
# creation with the standard per-user data directory for this platform
# (%LOCALAPPDATA%\pypts on Windows, ~/.local/share/pypts on Linux).
#
# Point these somewhere else to move pypts' output - a network share, a bench
# drive, a scratch disk. Absolute paths only. Directories are created if they
# do not exist.
base_dir =

# Where the run log is written. One timestamped file per run.
logs_dir =

# Where reports are written after an execution.
reports_dir =

[logging]
# Minimum level written to the run log:
# DEBUG, INFO, WARNING, ERROR or CRITICAL.
#
# DEBUG additionally turns on the message trace - every message on every link,
# logged twice, once by the sender and once by the receiver. Useful when the
# question is "who sent what to whom"; very noisy otherwise.
#
# The --log-level command line option overrides this for a single run.
level = INFO

[report]
# Output format of the generated report: html or csv.
type = html

# Visual style of the generated report.
theme = default

[gui]
# Appearance of the graphical frontend: default, light or dark.
theme = default

# Size of the main window, in pixels, when it opens.
window_width = 1280
window_height = 720

[hardware.example_device]
# Hardware is configured one section per device, named hardware.<logical name>.
# Recipes refer to the logical name - the part after the dot - so a recipe never
# names a resource string, and moving an instrument means editing this file only.
#
# Copy this section, rename it (for example [hardware.dmm1]) and fill it in.
# Every hardware.* section is validated against the keys below, so a device with
# a key that is not listed here is reported rather than silently ignored.
#
# This example section is a placeholder: nothing reads it yet. The hardware
# abstraction layer that will is not implemented.
driver = none
resource = none
timeout_s = 5.0
