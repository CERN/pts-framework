# The devices on this bench, one section each, by logical name. Test code asks
# for a device by that name: pyhal.get_device("ssh1"). `driver` names the
# driver class; every other key goes to the driver. Nothing is masked: the log
# shows every value as written, a password included, and this file is plain
# text: prefer key_filename to password.
#
# A new bench starts with one device, meteo_Meyrin: a weather station on the
# internet (Open-Meteo, no key needed), so there is something to try without
# hardware. It needs internet access only when a test opens it. Delete the
# section when the bench has real devices.

[meteo_Meyrin]
driver = pyhal.drivers.weather.OpenMeteoDriver
place = CERN Meyrin
latitude = 46.23
longitude = 6.05

