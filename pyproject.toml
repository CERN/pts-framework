[build-system]
requires = ["setuptools", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pts-framework"
dynamic = [
  "version",  # The version is taken directly from the repository, using setuptools-scm.
]
# description = "<Insert short description of the project>"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
authors = [
  { name = "Odd Oyvind Andreassen", email = "odd.oyvind.andreassen@cern.ch" },
  { name = "Joseph Tagg", email = "joseph.tagg@cern.ch" },
  { name = "Bartlomiej Banas", email = "joseph.tagg@cern.ch" },
  { name = "Alvaro Martinez Landete", email = "alvaro.martinez.landete@cern.ch" },
]
# Specify the minimum Python version required. It is not safe to use
# this to control the *upper* version of Python.
requires-python = ">=3.11"

# The core dependencies of the project.
dependencies = [
  "numpy",
  # Per-user config/data directories, so config.ini and the run output land
  # where the platform expects rather than in the temp directory.
  "platformdirs",
  # 6.9.1 breaks QGraphicsItem.setParentItem for items whose itemChange returns
  # super()'s value: pyqtgraph curves never join their ViewBox. Fixed in 6.9.2.
  "PySide6==6.9.2",
  "pydantic>=2.6",
  # The XY-graph plot widget (src/pyrade_xy_graph/) is built on it.
  "pyqtgraph>=0.13",
  "PyYAML==6.0.2",
  "ruamel.yaml",
]

[project.optional-dependencies]
# The optional dependencies of the project, installable using the "extras" syntax.
test = [
  "pytest",
  "pytest-qt",
  # The SSH driver's tests run against a mocked client, but import paramiko.
  "paramiko",
  # tests/quality_tests/ runs both. Pinned, so a new release cannot turn a
  # green branch red on its own; bump them on purpose.
  "ruff==0.16.2",
  "mypy==2.3.0",
]
doc = [
  "Sphinx",
  "sphinx",
  "acc-py-sphinx",
]
# Hardware drivers. The core ships none of their libraries; a bench installs
# what its drivers need: pip install pts-framework[ssh], or [hardware] for all.
ssh = ["paramiko"]
ni = ["nidmm==1.4.8", "hightime==0.2.2"]
serial = ["pyserial"]
hardware = ["pts-framework[ssh,ni,serial]"]
dev = [
  # Dependencies for development of the project, such as type checkers,
  # linters, etc.
  # "requirement-for-development-purposes-only",

  # Include the "test" dependencies in the dev dependencies (ruff and mypy come
  # with them). Not "doc": its acc-py-sphinx is on CERN's package index only, so
  # it broke a dev install anywhere else.
  "pts-framework[test]",
]

[project.scripts]
# The `pypts` command pip creates on install: the same entry point as
# `python -m pypts`, so `pypts --mode cli` works wherever the install's
# scripts folder is on PATH (an activated venv, uv tool / pipx).
pypts = "pypts.launcher.startup:main"

[project.urls]
# Homepage = "PyPTS repository"
Repository = "https://gitlab.cern.ch/pts/framework/pypts"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pypts", "pypts.*", "pyrade_xy_graph", "pyrade_xy_graph.*"]

[tool.setuptools.package-data]
# All package data which is tracked by git is included automatically due to
# include-package-data=true (the default) along with setuptools-scm. More details at:
# https://setuptools.pypa.io/en/latest/userguide/datafiles.html#include-package-data

[tool.setuptools_scm]
# Tell setuptools_scm to write a _version.py file in the package. The
# _version.py file must not be committed to the repository.
version_file = "src/pypts/_version.py"

[tool.pytest.ini_options]
# Default selection when pytest is invoked without arguments.
testpaths = ["tests/unit_tests", "tests/functional_tests", "tests/quality_tests"]

[tool.ruff]
# 100 rather than the default 88: the module docstrings in this project carry the
# reasoning behind each decision, and 88 breaks their sentences badly. The code
# itself already fits well inside 100.
line-length = 100
target-version = "py311"

# Frozen or unintegrated code that is not held to the current style.
#   old_code/  is the legacy implementation, read-only by project rule.
exclude = [
  "src/pypts/old_code",
  "docs/source/conf.py",
  # Copied upstream code (CERN pyrade_xy_graph), not held to this style.
  "src/pyrade_xy_graph",
]

[tool.ruff.lint]
# Chosen so that the `# noqa:` codes already written into the source mean
# something: BLE001 on the event loops, DTZ007 in the trace parser, B008 on the
# Qt model overrides. Before this section existed those suppressions named rules
# that nothing enabled.
select = [
  "E",      # pycodestyle
  "F",      # pyflakes - undefined names, unused imports, unused variables
  "I",      # import sorting, so import order is mechanical rather than argued about
  "N",      # pep8-naming
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "BLE",    # blind except
  "DTZ",    # naive datetime
  "SIM",    # simplifiable code
  "PIE",    # misc lints
  "G",      # logging format - keeps log calls %-style and lazily formatted
  "RUF",    # ruff's own rules
]

ignore = [
  # N818 wants every exception class to end in "Error". `UnhandledMessage` is
  # named for what it carries rather than for its class, deliberately and
  # consistently across the docs, and `ConfigError` is already the base of a
  # family that reads correctly. Renaming them to satisfy a suffix rule would
  # cost more than it buys.
  "N818",

  # SIM108 rewrites a four-line if/else into a one-line conditional expression.
  # This project prefers the plain form: an if/else reads top to bottom and
  # takes an extra branch without being restructured. Shortest is not clearest.
  "SIM108",
]

# The framework's logger is exported as `log` from pypts.logger.log, so ruff has
# to be told that it is a logger - otherwise the G rules see an ordinary object
# and the %-style convention stays unenforced.
logger-objects = ["pypts.logger.log.log"]

[tool.ruff.lint.per-file-ignores]
# The helper applications are pre-refactor and are ported in roadmap Phase 6.
# Silenced wholesale rather than half-fixed, so the rest of the tree has a clean
# baseline; the outstanding findings are recorded in the roadmap.
"src/pypts/helper_applications/recipe_creator/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["pypts"]

[tool.mypy]
# Scoped to the message layer and the modules that handle messages, which is
# where the type annotations are load-bearing rather than decorative:
#
#   - `unhandled()` is typed `Never`, so a `match` that has forgotten a member
#     of a link's union is an error here. The protocol tests already catch that
#     at test time; this catches it while the code is being written.
#   - `QueueWrapper[CoreToSequencer]` says which messages may travel on a link.
#     Nothing checked that before, so sending the wrong message on the wrong
#     link ran perfectly and arrived in the wrong place.
#
# Not the whole tree on purpose: old_code/ is frozen, and the helper
# applications are Phase 6. Widening the scope is cheap once
# those are dealt with.
python_version = "3.11"
files = [
  "src/pypts/messages",
  "src/pypts/core",
  "src/pypts/sequencer",
  "src/pypts/report",
  "src/pypts/logger",
  "src/pypts/utilities",
  "src/pypts/hmi/hmi_client.py",
  "src/pypts/api",
  "src/pypts/hal",
]

# Deliberately not `strict`. The value here is in the message contract being
# checked, and demanding an annotation on every local in the modules around it
# would bury that in noise. Tighten when the engine port settles.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
# PySide6 ships incomplete stubs and the GUI is Phase 3.
module = "PySide6.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML ships no type information and types-PyYAML is not installed, so mypy
# has to be told the untyped import is fine.
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Kept from when mypy ran in a CI job without the project's dependencies.
# pydantic is installed now; dropping this lets mypy check against its real
# types, which is a change of its own.
module = ["pydantic", "pydantic.*", "pydantic_core", "pydantic_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The SSH driver imports paramiko, which ships no type information.
module = ["paramiko", "paramiko.*"]
ignore_missing_imports = true

[tool.acc_py_template]
features = [
  {name = "core", version = 2},
  {name = "docs", version = 2},
]
