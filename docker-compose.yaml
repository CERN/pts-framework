services:
  pypts:
    image: cern/pts-framework:latest
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./pts_reports:/home/pts/pts_reports
      - ./recipes:/recipes
