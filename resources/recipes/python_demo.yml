# The PythonModule showcase, and the reference for the simplified recipe
# format: a recipe states only what it needs, every optional field left out
# is assumed empty. The rules live in src/pypts/recipe/rules.py; the
# readable page is resources/internal_reports/recipe_format.html.
#
# Header: only `name` is mandatory. `main_sequence` is omitted here, so the
# first sequence in the file is the one a frontend offers to run.
name: Python demo
description: Four function calls and a wait - PythonModule end to end.
version: 1.0.0
---
# Sequence: only `sequence_name` and `steps` are mandatory.
sequence_name: Main
description: Adds, measures, waits, checks and greets.
steps:
  # A PythonModule step requires `module` and `method_name`. `input_mapping`
  # is omitted when the method takes no arguments, `output_mapping` when
  # there is nothing to judge.
  - steptype: PythonModule
    step_name: Add numbers
    description: 2 + 3 must equal 5.
    module: example_tests.py
    method_name: add
    input_mapping:
      a: {value: 2}
      b: {value: 3}
    output_mapping:
      sum: {type: equals, value: 5}
  - steptype: PythonModule
    step_name: Measure voltage
    description: The reading must sit between 11 and 13 volts.
    module: example_tests.py
    method_name: measure_voltage
    output_mapping:
      voltage: {type: range, min: '11', max: '13'}
  # A Wait step requires only `wait_time`, written directly on the step -
  # no mappings.
  - steptype: Wait
    step_name: Settle
    description: Let the bench settle for two seconds.
    wait_time: 2
  - steptype: PythonModule
    step_name: Even check (fails on purpose)
    description: 7 is not even - this one shows a FAIL verdict.
    module: example_tests.py
    method_name: is_even
    input_mapping:
      number: {value: 7}
    output_mapping:
      even: {type: passfail}
  - steptype: PythonModule
    step_name: Greet the operator
    description: A scalar return, wrapped as "output" and compared.
    module: example_tests
    method_name: greet
    input_mapping:
      name: {value: operator}
    output_mapping:
      output: {type: equals, value: 'Hello, operator!'}
