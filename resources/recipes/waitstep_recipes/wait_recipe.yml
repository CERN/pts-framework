# The Wait showcase, and the smallest recipe that runs: two Wait steps and
# nothing else, no test code. The one to load first, with
# `load_recipe resources/recipes/waitstep_recipes/wait_recipe.yml` in the CLI.
#
# One steptype per demo folder under resources/recipes/ - the list is in
# pythonmodulestep_recipes/pythonmodulestep_demo.yml.
name: Wait demo
description: Two short waits - the smallest recipe that runs end to end.
version: 0.2
---
sequence_name: Main
description: Waits twice, briefly.
steps:
  - steptype: Wait
    step_name: First wait
    description: Pause briefly.
    wait_time: '0.5'
  - steptype: Wait
    step_name: Second wait
    description: Pause briefly again.
    wait_time: '0.5'
