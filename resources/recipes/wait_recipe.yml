# The smallest recipe that actually runs on the new engine: two Wait steps
# and nothing else. The other recipes in this folder still target the old
# engine's step types and reference a test package that is not in the repo -
# this one exists so `load_recipe resources/recipes/wait_recipe.yml` has
# something real to load until they are portable.
name: Wait demo
description: Two short waits - the smallest recipe that runs end to end.
version: 1.0.0
---
sequence_name: Main
description: Waits twice, briefly.
steps:
  - steptype: Wait
    step_name: First wait
    description: Pause briefly.
    wait_time: '0.5'
  - steptype: Wait
    step_name: Second wait
    description: Pause briefly again.
    wait_time: '0.5'
