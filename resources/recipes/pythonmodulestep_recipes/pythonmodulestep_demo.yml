# The PythonModule showcase - one steptype, four calls into the shared test
# code in ../common/example_tests.py (a `module:` path is relative to this
# recipe's folder). It is also the reference for the simplified recipe format:
# a recipe states only what it needs, every optional field left out is assumed
# empty. The format is described in recipe_guide.html at the repository root.
#
# The demo recipes, one folder each under resources/recipes/:
#   pythonmodulestep_recipes/    this file
#   userinteractionstep_recipes/ asking the operator to choose
#   userwritestep_recipes/       asking the operator to type
#   userloadingstep_recipes/     asking the operator to pick a file or folder
#   indexedstep_recipes/         one authored step, N real ones
#   sequencestep_recipes/        groups of steps called from the main sequence
#   waitstep_recipes/            the Wait step
#   stepimage_recipes/           a picture on a step or a sequence
#   HAL_recipes/                 test code reaching bench devices by name
#   showcase_recipes/            all of them together: showcase_automated.yml
#                                (runs headless) and showcase_full.yml (GUI)
#   common/                      the test code the demos share
#
# Header: only `name` and `version` are mandatory. `main_sequence` is omitted here, so the
# first sequence in the file is the one a frontend offers to run.
name: PythonModule demo
description: Four function calls - PythonModule end to end.
version: 0.2
---
# Sequence: only `sequence_name` and `steps` are mandatory.
sequence_name: Main
description: Adds, measures, checks and greets.
steps:
  # A PythonModule step requires `module` and `method_name`. `inputs`
  # is omitted when the method takes no arguments, `outputs` when
  # there is nothing to judge.
  - steptype: PythonModule
    step_name: Add numbers
    description: 2 + 3 must equal 5.
    module: ../common/example_tests.py
    method_name: add
    inputs:
      a: 2
      b: 3
    outputs:
      sum: {type: equals, value: 5}
  - steptype: PythonModule
    step_name: Measure voltage
    description: The reading must sit between 11 and 13 volts.
    module: ../common/example_tests.py
    method_name: measure_voltage
    outputs:
      voltage: {type: range, min: '11', max: '13'}
  - steptype: PythonModule
    step_name: Even check (fails on purpose)
    description: 7 is not even - this one shows a FAIL verdict.
    module: ../common/example_tests.py
    method_name: is_even
    inputs:
      number: 7
    outputs:
      even: {type: passfail}
  # `module` needs no .py suffix, and a scalar return is wrapped as "output".
  - steptype: PythonModule
    step_name: Greet the operator
    description: A scalar return, wrapped as "output" and compared.
    module: ../common/example_tests
    method_name: greet
    inputs:
      name: operator
    outputs:
      output: {type: equals, value: 'Hello, operator!'}
